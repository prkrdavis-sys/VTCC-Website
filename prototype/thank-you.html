<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request received | Victoria Transcultural Clinical Center</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        try {
          var raw = sessionStorage.getItem('vtcc-form-ink')
          if (!raw) return
          var data = JSON.parse(raw)
          if (!data || Date.now() - data.t > 10000) {
            sessionStorage.removeItem('vtcc-form-ink')
            return
          }
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
          var root = document.documentElement
          root.classList.add('is-ink-arrival')
          root.style.setProperty('--ink-x', data.x + 'px')
          root.style.setProperty('--ink-y', data.y + 'px')
        } catch (error) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="speculationrules">
      {"prerender":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>window.VTCC_PAGE = "thank-you"; window.VTCC_BASE = "";</script>
    <script src="seo-content.js"></script>
    <script src="site-content.js"></script>
    <script src="i18n.js"></script>
  </body>
</html>
